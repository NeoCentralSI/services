# ─────────────────────────────────────────────────────────────────
# Production Docker Compose – Tugas Akhir Backend
# Usage:
#   1. Copy .env.example → .env and fill in all values
#   2. docker compose up -d
# ─────────────────────────────────────────────────────────────────
services:



  # ── DB (MariaDB) ───────────────────────────────────────────────
  db:
    image: mariadb:10.11
    container_name: neocentral-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: tka_db
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - neocentral-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: neocentral-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - neocentral-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Gotenberg (PDF) ────────────────────────────────────────────
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: neocentral-gotenberg
    restart: unless-stopped
    ports:
      - "3001:3000"
    command:
      - gotenberg
      - "--chromium-disable-routes=false"
      - "--api-timeout=60s"
    networks:
      - neocentral-net
    # Not exposed externally – only reachable by the app container

# ─────────────────────────────────────────────────────────────────
volumes:
  uploads:
  redis-data:
  db-data:

networks:
  neocentral-net:
    driver: bridge