services:
  backend:
    build:
      context: .
      target: runner
    image: ${BACKEND_IMAGE:-neocentral-backend}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3000}:3000"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
    networks:
      - backend-internal
      - neocentral
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Explicit local tools; these never start with a normal "docker compose up".
  # Fresh schema: docker compose --profile tools run --rm backend-tools
  # Seed data:    docker compose --profile tools run --rm backend-tools node scripts/seed-master.js
  backend-tools:
    profiles: ["tools"]
    build:
      context: .
      target: tools
    image: ${BACKEND_TOOLS_IMAGE:-neocentral-backend-tools}
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
    command: ["./node_modules/.bin/prisma", "db", "push"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-internal
      - neocentral

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-neocentral}
      MYSQL_USER: ${MYSQL_USER:-neocentral}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - backend-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    networks:
      - backend-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - gotenberg
      - --api-port=3001
      - --chromium-disable-routes=false
      - --api-timeout=60s
    networks:
      - backend-internal
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  uploads-data:
  redis-data:
  db-data:

networks:
  backend-internal:
    driver: bridge
  neocentral:
    external: true
    name: ${SHARED_NETWORK_NAME:-neocentral}
