# CI/CD – Backend (services)
# Triggers on push to staging branch
# Self-hosted runner on VM → build Docker image locally → deploy
name: Deploy Backend

on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  DEPLOY_DIR: /www/wwwroot/neocentral
  IMAGE_TAG: neocentral/services:latest

jobs:
  # Build & Deploy
  deploy:
    name: Build & Deploy
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      # Dummy URL for prisma validate during pre-deploy verify (no live DB needed).
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci

    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify backend before deployment
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prisma validate
          pnpm test

      - name: Build Docker image locally
        run: docker build -t ${{ env.IMAGE_TAG }} .

      - name: Update docker-compose on VM
        run: |
          cp -f docker-compose.prod.yml ${{ env.DEPLOY_DIR }}/docker-compose.yml

      - name: Deploy backend
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose up -d backend --force-recreate
          echo "Waiting for backend to be healthy..."
          sleep 10

      - name: Run Prisma migrations
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          # Staging DB historically used db push and may lack `_prisma_migrations`.
          # Prefer migrate deploy; fall back to schema sync so deploy is not blocked.
          docker compose exec -T backend npx prisma migrate deploy \
            || docker compose exec -T backend npx prisma db push

      - name: Cleanup old images
        run: docker image prune -f

      - name: Verify deployment
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose ps backend
          echo "Backend deployed successfully"
