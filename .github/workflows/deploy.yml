name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to deploy (empty = the selected branch)
        type: string
        default: ""
      schema_applied:
        description: I already ran "docker compose run --rm backend db-push" for this commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: staging-backend
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
      JWT_SECRET: ci-jwt-secret-for-tests-only
      REFRESH_TOKEN_SECRET: ci-refresh-secret-for-tests-only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma validate
      - run: pnpm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.PUBLIC_URL }}/health
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          for name in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_HOST DEPLOY_PORT DEPLOY_USER; do
            test -n "${!name}" || { echo "::error::$name is empty"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  ServerAliveInterval 30\n' \
            "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_USER" > ~/.ssh/config
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts ~/.ssh/config

      # The image is always built. If prisma/schema.prisma changed since the running commit,
      # the running container is kept until the schema is applied by hand with the new image,
      # then this workflow is run again with schema_applied ticked.
      - name: Pull, build, and start on the server
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          DEPLOY_SHA: ${{ needs.verify.outputs.sha }}
          SCHEMA_APPLIED: ${{ github.event_name == 'workflow_dispatch' && inputs.schema_applied }}
        run: |
          test -n "$DEPLOY_DIR" || { echo "::error::variable DEPLOY_DIR is empty"; exit 1; }
          ssh vps "DEPLOY_DIR='$DEPLOY_DIR' DEPLOY_SHA='$DEPLOY_SHA' SCHEMA_APPLIED='$SCHEMA_APPLIED' bash -s" <<'REMOTE' | tee /tmp/remote.log
          set -euo pipefail
          cd "$DEPLOY_DIR"
          RUNNING_SHA="$(cat .deployed-sha 2>/dev/null || git rev-parse HEAD)"
          git fetch --quiet origin "$DEPLOY_SHA"
          git checkout --quiet -f -B main "$DEPLOY_SHA"
          docker compose build backend

          if [ "$SCHEMA_APPLIED" != "true" ] && ! git diff --quiet "$RUNNING_SHA" "$DEPLOY_SHA" -- prisma/schema.prisma; then
            echo "SCHEMA_HOLD"
            exit 0
          fi

          docker compose up -d backend
          for attempt in $(seq 1 45); do
            if docker compose exec -T backend curl --fail --silent http://127.0.0.1:3000/health >/dev/null 2>&1; then
              printf '%s\n' "$DEPLOY_SHA" > .deployed-sha
              docker image prune -f >/dev/null
              docker compose ps
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=150 backend
          exit 1
          REMOTE

      - name: Report schema hold
        id: hold
        run: |
          if grep -qx 'SCHEMA_HOLD' /tmp/remote.log; then
            echo "held=true" >> "$GITHUB_OUTPUT"
            echo "::warning::prisma/schema.prisma changed. The new image is built; the old backend is still running."
            {
              echo "## Apply the database schema"
              echo "On the server:"
              echo '```bash'
              echo 'cd "$DEPLOY_DIR" && docker compose run --rm backend db-push'
              echo '```'
              echo "Then run this workflow again (Run workflow, same ref) with **schema_applied** ticked."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Public URL answers
        if: steps.hold.outputs.held != 'true'
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          test -n "$PUBLIC_URL" || { echo "::error::variable PUBLIC_URL is empty"; exit 1; }
          for attempt in $(seq 1 10); do
            curl --fail --silent --show-error --output /dev/null "$PUBLIC_URL/health" && exit 0
            sleep 3
          done
          exit 1
