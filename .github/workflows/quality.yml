name: Backend Quality Gate

on:
  pull_request:
  push:
    branches: [main, develop, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Minimal required env for prisma validate + unit tests (no real services).
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
      JWT_SECRET: ci-jwt-secret-for-tests-only
      REFRESH_TOKEN_SECRET: ci-refresh-secret-for-tests-only
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - run: pnpm test
