  "/calendar/upcoming":
    $ref: "./calendar/swagger-calendar.yaml#/paths/~1calendar~1upcoming"

  "/calendar/statistics":
    $ref: "./calendar/swagger-calendar.yaml#/paths/~1calendar~1statistics"

  "/thesisGuidance/lecturer/my-students":
