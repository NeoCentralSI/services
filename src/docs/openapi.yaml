  "/topics/{id}":
    $ref: "./topic/swagger-topic.yaml#/paths/~1topics~1{id}"

  # Thesis Monitoring (Kadep/Sekdep)
  "/thesisGuidance/monitoring/dashboard":
    get:
      tags: [Thesis Monitoring]
      summary: Get thesis monitoring dashboard summary
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Monitoring dashboard returned
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  "/thesisGuidance/monitoring/theses":
    get:
      tags: [Thesis Monitoring]
      summary: List monitored theses with filters and pagination
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: lecturerId
          schema: { type: string, format: uuid }
        - in: query
          name: topicId
          schema: { type: string, format: uuid }
        - in: query
          name: academicYear
          schema: { type: string, format: uuid }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Monitored theses returned
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  "/thesisGuidance/monitoring/filters":
    get:
      tags: [Thesis Monitoring]
      summary: Get monitoring filter options
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Filter options returned
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  "/thesisGuidance/monitoring/report":
    get:
      tags: [Thesis Monitoring]
      summary: Get thesis monitoring report data
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Monitoring report data returned
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  "/thesisGuidance/monitoring/report/download":
    get:
      tags: [Thesis Monitoring]
      summary: Download thesis monitoring report as PDF
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: PDF report returned
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  "/thesisGuidance/monitoring/at-risk":
    get:
      tags: [Thesis Monitoring]
      summary: List at-risk students
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: At-risk students returned
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  "/thesisGuidance/monitoring/slow":
    get:
      tags: [Thesis Monitoring]
      summary: List students with slow progress
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: academicYear
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Slow-progress students returned
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  "/thesisGuidance/monitoring/ready-seminar":
    get:
      tags: [Thesis Monitoring]
      summary: List students ready for seminar
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Students ready for seminar returned
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  "/thesisGuidance/monitoring/supervisor-loads":
    get:
      tags: [Thesis Monitoring]
      summary: Get supervisor workload summary
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Supervisor workloads returned
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  "/thesisGuidance/monitoring/theses/{thesisId}":
    get:
      tags: [Thesis Monitoring]
      summary: Get monitored thesis detail
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: thesisId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Thesis detail returned
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Thesis not found
  "/thesisGuidance/monitoring/theses/{thesisId}/send-warning":
    post:
      tags: [Thesis Monitoring]
      summary: Send a warning notification for one thesis
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: thesisId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warningType]
              properties:
                warningType:
                  type: string
                  enum: [SLOW, AT_RISK]
      responses:
        "200":
          description: Warning notification sent
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Thesis not found
  "/thesisGuidance/monitoring/batch-warning":
    post:
      tags: [Thesis Monitoring]
      summary: Send warning notifications for multiple theses
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [thesisIds, warningType]
              properties:
                thesisIds:
                  type: array
                  items: { type: string, format: uuid }
                warningType:
                  type: string
                  enum: [SLOW, AT_RISK]
      responses:
        "200":
          description: Batch warnings processed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  # ============================================
  # Supervision Quota Endpoints
  # ============================================

  "/quota/browse":
    $ref: "./quota/swagger-quota.yaml#/paths/~1quota~1browse"
  "/quota/browse/{lecturerId}":
    $ref: "./quota/swagger-quota.yaml#/paths/~1quota~1browse~1{lecturerId}"
  "/quota/check/{lecturerId}":
    $ref: "./quota/swagger-quota.yaml#/paths/~1quota~1check~1{lecturerId}"
  "/quota/science-groups":
    $ref: "./quota/swagger-quota.yaml#/paths/~1quota~1science-groups"
  "/quota/topics":
    $ref: "./quota/swagger-quota.yaml#/paths/~1quota~1topics"
  "/quota/config/default":
    $ref: "./quota/swagger-quota.yaml#/paths/~1quota~1config~1default"
  "/quota/config/lecturer/{id}":
    $ref: "./quota/swagger-quota.yaml#/paths/~1quota~1config~1lecturer~1{id}"
  "/quota/accepting-requests":
    $ref: "./quota/swagger-quota.yaml#/paths/~1quota~1accepting-requests"
  "/quota/monitoring":
    $ref: "./quota/swagger-quota.yaml#/paths/~1quota~1monitoring"

  # Audit Logs
  "/audit-logs":
    $ref: "./auditLog/swagger-auditLog.yaml#/paths/~1audit-logs"
  "/audit-logs/filters":
    $ref: "./auditLog/swagger-auditLog.yaml#/paths/~1audit-logs~1filters"
  "/audit-logs/{id}":
    $ref: "./auditLog/swagger-auditLog.yaml#/paths/~1audit-logs~1{id}"

components:
  schemas:
    FailThesisBody:
      type: object
      properties:
        reason:
          type: string
    FeedbackBody:
      type: object
      required: [feedback]
      properties:
        feedback:
          type: string
    ApproveGuidanceBody:
      type: object
      properties:
        feedback:
          type: string
        meetingUrl:
          type: string
          format: uri
        approvedDate:
          type: string
          format: date-time
          description: Override approved date (defaults to requestedDate)
        type:
          type: string
          enum: [online, offline]
        duration:
          type: integer
          description: Duration in minutes
        location:
          type: string
    ApproveComponentsBody:
      type: object
      required: [componentIds]
      properties:
        componentIds:
          type: array
          items: { type: string }
    MyStudentItem:
      type: object
      properties:
        studentId: { type: string }
        fullName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        identityNumber: { type: string, nullable: true }
        thesisId: { type: string }
        thesisTitle: { type: string, nullable: true }
        roles:
          type: array
          items: { type: string }
    GuidanceItem:
      type: object
      properties:
        id: { type: string }
        thesisId: { type: string }
        supervisorId: { type: string, nullable: true }
        supervisorName: { type: string, nullable: true }
        studentId: { type: string, nullable: true }
        studentName: { type: string, nullable: true }
        status: 
          type: string
          enum: [requested, accepted, rejected, completed, cancelled]
        requestedDate: { type: string, format: date-time, nullable: true }
        requestedDateFormatted: { type: string, nullable: true }
        approvedDate: { type: string, format: date-time, nullable: true }
        approvedDateFormatted: { type: string, nullable: true }
        type: 
          type: string
          enum: [online, offline]
          nullable: true
        duration: { type: integer, nullable: true, description: "Duration in minutes" }
        location: { type: string, nullable: true }
        meetingUrl: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        supervisorFeedback: { type: string, nullable: true }
        rejectionReason: { type: string, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }
        document:
          type: object
          nullable: true
          properties:
            fileName: { type: string }
            filePath: { type: string }
    ProgressSummaryItem:
      type: object
      properties:
        thesisId: { type: string }
        validated: { type: integer }
        total: { type: integer }
    ProgressDetailItem:
      type: object
      properties:
        componentId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        orderIndex: { type: integer }
        isMandatory: { type: boolean }
        completedAt: { type: string, format: date-time, nullable: true }
        validatedBySupervisor: { type: boolean }
        validatedAt: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
        evidenceUrl: { type: string, nullable: true }
    SupervisorItem:
      type: object
      properties:
        lecturerId: { type: string }
        role: { type: string, nullable: true }
        user:
          type: object
          nullable: true
          additionalProperties: true
    StudentRequestGuidanceBody:
      type: object
      required: [guidanceDate]
      properties:
        guidanceDate: { type: string, format: date-time }
        studentNotes: { type: string }
        type: 
          type: string
          enum: [online, offline]
          default: online
        duration: 
          type: integer
          default: 60
          description: Duration in minutes
        location: { type: string }
        supervisorId: { type: string, format: uuid }
        meetingUrl: { type: string, format: uri }
    StudentRescheduleGuidanceBody:
      type: object
      required: [guidanceDate]
      properties:
        guidanceDate: { type: string, format: date-time }
        studentNotes: { type: string }
        type: 
          type: string
          enum: [online, offline]
        duration: 
          type: integer
          description: Duration in minutes
        location: { type: string }
    StudentNotesBody:
      type: object
      required: [studentNotes]
      properties:
        studentNotes: { type: string }
    StudentCompleteComponentsBody:
      type: object
      required: [componentIds]
      properties:
        componentIds:
          type: array
          items: { type: string }
        completedAt: { type: string, format: date-time }
    UpdateUserRequest:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          description: Adds roles (non-admin only); existing roles are kept. Items can be string or object with status.
          items:
            oneOf:
              - type: string
              - type: object
                properties:
                  name:
                    type: string
                  status:
                    type: string
                    enum: [active, nonActive]
        identityNumber:
          type: string
        identityType:
          type: string
          enum: [NIM, NIP, OTHER]
        isVerified:
          type: boolean
    CreateAcademicYearRequest:
      type: object
      properties:
        semester:
          type: string
          enum: [ganjil, genap]
        year:
          type: integer
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
    UpdateAcademicYearRequest:
      type: object
      properties:
        semester:
          type: string
          enum: [ganjil, genap]
        year:
          type: integer
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      required: [email]
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
          description: Roles to assign to the new user ("admin" will be ignored)
        identityNumber:
          type: string
        identityType:
          type: string
          enum: [NIM, NIP, OTHER]
    CreateUserResponse:
      type: object
      properties:
        message:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
              format: email
            roles:
              type: array
              items:
                type: string
  
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthUser:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          description: Roles owned by the user
          items:
            $ref: "#/components/schemas/RoleItem"
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        user:
          $ref: "#/components/schemas/AuthUser"
        accessToken:
          type: string
        refreshToken:
          type: string
    RoleItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, nonActive]
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    RefreshResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        accessToken:
          type: string
        refreshToken:
          type: string
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    NotificationSample:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        message:
          type: string
    ImportStudentsSummary:
      type: object
      properties:
        created:
          type: integer
          example: 10
        updated:
          type: integer
          example: 0
        skipped:
          type: integer
          example: 5
        failed:
          type: integer
          example: 1
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        status:
          type: integer
          example: 500
        message:
          type: string
          example: Internal Server Error
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          example: /user
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
