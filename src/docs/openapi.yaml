  "/notification/fcm/register":
    $ref: "./notification/swagger-notification.yaml#/notification_fcm_register"

  "/notification/fcm/unregister":
    $ref: "./notification/swagger-notification.yaml#/notification_fcm_unregister"

  "/calendar/my-events":
