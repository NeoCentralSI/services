# yaml-language-server: $schema=./openapi-schema.json
openapi: 3.1.0
info:
  title: Backend API
  version: 0.1.0
  description: |
    OpenAPI specification for the Backend API (Express + Prisma + Redis).

  Notes:
  - Spec is modularized by feature area (auth, admin, thesis guidance) using external $refs.
  - Error responses follow a unified JSON format from error.middleware.js.
  contact:
    name: API Support
servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: System
    description: System/health endpoints
  - name: Auth
    description: Authentication endpoints (JWT access + refresh)
  - name: AdminFeatures
    description: Admin-only utilities and maintenance endpoints
  - name: Notification
    description: Notification management and FCM token endpoints
  - name: Calendar
    description: Calendar and event management endpoints
  - name: LecturerThesisGuidance
    description: Lecturer-side thesis guidance endpoints
  - name: StudentThesisGuidance
    description: Student-side thesis guidance endpoints
  - name: Milestone
    description: Thesis milestone management endpoints
  - name: Topic
    description: Thesis topic management endpoints (Sekretaris Departemen)
  - name: Thesis Monitoring
    description: Thesis monitoring endpoints for Kadep/Sekdep
  - name: SIA Sync
    description: External SIA (Academic Information System) synchronization endpoints
  - name: AuditLog
    description: Audit log endpoints for tracking critical actions
  - name: Supervision Quota
    description: Browse lecturers, check quota availability, and toggle accepting requests
  - name: Supervision Quota - Admin
    description: Admin/Kadep endpoints for managing default and per-lecturer quota overrides

paths:
  "/":
    get:
      tags: [System]
      summary: API health check
      operationId: getHealth
      responses:
        "200":
          description: Health OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: "API is running 🚀"
        "500":
          $ref: "#/components/responses/InternalError"

  

  "/auth/login":
    $ref: "./auth/swagger-auth.yaml#/auth_login"

  "/auth/refresh":
    $ref: "./auth/swagger-auth.yaml#/auth_refresh"

  "/auth/me":
    $ref: "./auth/swagger-auth.yaml#/auth_me"

  "/auth/logout":
    $ref: "./auth/swagger-auth.yaml#/auth_logout"

  "/auth/password":
    $ref: "./auth/swagger-auth.yaml#/auth_password"

  "/auth/profile":
    $ref: "./auth/swagger-auth.yaml#/auth_profile"

  "/auth/reset/request":
    $ref: "./auth/swagger-auth.yaml#/auth_reset_request"

  "/auth/reset/verify":
    $ref: "./auth/swagger-auth.yaml#/auth_reset_verify"

  "/auth/reset/confirm":
    $ref: "./auth/swagger-auth.yaml#/auth_reset_confirm"

  "/auth/verify":
    $ref: "./auth/swagger-auth.yaml#/auth_verify"

  "/auth/verify/request":
    $ref: "./auth/swagger-auth.yaml#/auth_verify_request"

  "/auth/microsoft/login":
    $ref: "./auth/swagger-microsoft-auth.yaml#/microsoft_login"

  "/auth/microsoft/callback":
    $ref: "./auth/swagger-microsoft-auth.yaml#/microsoft_callback"

  "/sia/sync":
    $ref: "./sia/swagger-sia.yaml#/paths/~1sia~1sync"

  "/sia/sync/status":
    $ref: "./sia/swagger-sia.yaml#/paths/~1sia~1sync~1status"

  "/sia/cached":
    $ref: "./sia/swagger-sia.yaml#/paths/~1sia~1cached"

  "/adminfeatures/students/import":
    $ref: "./admin/swagger-admin.yaml#/admin_import_students"

  "/adminfeatures/users":
    get:
      $ref: "./admin/swagger-admin.yaml#/admin_get_users"
    post:
      $ref: "./admin/swagger-admin.yaml#/admin_create_user"

  "/adminfeatures/students":
    $ref: "./admin/swagger-admin.yaml#/admin_get_students"

  "/adminfeatures/lecturers":
