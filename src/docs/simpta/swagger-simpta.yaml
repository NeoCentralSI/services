paths:
  /advisorRequest/access-state:
    get:
      tags: [AdvisorRequest]
      summary: Get canonical advisor access state
      description: >-
        Includes ta04AssignmentIssued so clients can close booking-withdraw
        actions immediately after the TA-04 assignment is issued, including
        data-repair cases where the active P1 relation is missing.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Advisor access state resolved
        '401':
          description: Unauthorized

  /advisorRequest/{id}/withdraw:
    post:
      tags: [AdvisorRequest]
      summary: Withdraw an advisor request or pre-TA-04 booking
      description: >-
        Pending review states follow the 72-hour withdrawal policy. A
        booking_approved request may be cancelled only while its thesis has no
        ta04AssignmentIssuedAt. After TA-04 is issued, supervisor changes are
        outside the active SIMPTA scope and this endpoint returns a bad request.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Request withdrawn
        '400':
          description: Withdrawal is locked or TA-04 has already been issued
        '401':
          description: Unauthorized
        '403':
          description: Request does not belong to the authenticated student
        '404':
          description: Request not found

  /advisorRequest/catalog:
    get:
      tags: [AdvisorRequest]
      summary: Browse lecturer advisor catalog with quota traffic light
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: academicYearId
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lecturer catalog returned

  /advisorRequest/draft:
    get:
      tags: [AdvisorRequest]
      summary: Get editable TA-01/TA-02 working draft for the current student
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Advisor request draft returned
    put:
      tags: [AdvisorRequest]
      summary: Save editable TA-01/TA-02 working draft for the current student
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lecturerId:
                  type: string
                  format: uuid
                  nullable: true
                topicId:
                  type: string
                  format: uuid
                  nullable: true
                proposedTitle:
                  type: string
                  nullable: true
                backgroundSummary:
                  type: string
                  nullable: true
                problemStatement:
                  type: string
                  nullable: true
                proposedSolution:
                  type: string
                  nullable: true
                researchObject:
                  type: string
                  nullable: true
                researchPermitStatus:
                  type: string
                  enum: [approved, in_process, not_approved]
                  nullable: true
                justificationText:
                  type: string
                  nullable: true
                  deprecated: true
                  description: Alias legacy untuk studentJustification.
                studentJustification:
                  type: string
                  nullable: true
                  description: Working-copy justifikasi akademik mahasiswa untuk escalated TA-01.
                attachmentId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '200':
          description: Advisor request draft saved

  /advisorRequest:
    post:
      tags: [AdvisorRequest]
      summary: Submit advisor request (TA-01 normal or TA-02 digital via KaDep)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lecturerId, topicId, proposedTitle, backgroundSummary, problemStatement, proposedSolution, researchObject, researchPermitStatus]
              properties:
                lecturerId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Opsional untuk TA-02 digital saat mahasiswa belum memiliki calon dosen pembimbing.
                topicId:
                  type: string
                  format: uuid
                proposedTitle:
                  type: string
                backgroundSummary:
                  type: string
                problemStatement:
                  type: string
                proposedSolution:
                  type: string
                researchObject:
                  type: string
                researchPermitStatus:
                  type: string
                  enum: [approved, in_process, not_approved]
                justificationText:
                  type: string
                  deprecated: true
                  description: Alias legacy untuk studentJustification.
                studentJustification:
                  type: string
                  minLength: 20
                  description: Wajib untuk escalated TA-01 bila mahasiswa tetap memilih dosen dengan kuota merah.
      responses:
        '200':
          description: Advisor request submitted

  /advisorRequest/{id}/respond:
    post:
      tags: [AdvisorRequest]
      summary: Lecturer accepts or rejects a TA-01 advisor request
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [accept, reject]
                approvalNote:
                  type: string
                  description: Generic lecturer approval note. For overquota acceptance, lecturerOverquotaReason is preferred.
                lecturerOverquotaReason:
                  type: string
                  minLength: 10
                  description: Required when the lecturer accepts an overquota request and forwards it to KaDep.
                rejectionReason:
                  type: string
      responses:
        '200':
          description: Lecturer response stored

  /advisorRequest/{id}/decide:
    post:
      tags: [AdvisorRequest]
      summary: KaDep decides an escalated TA-01 or TA-02 advisor request
      description: >-
        Path C (escalated TA-01): KaDep may only approve the requesting lecturer
        or redirect to an alternative lecturer — reject is not allowed.
        TA-02 dept route: KaDep assigns/redirects within department policy.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [approve, redirect, reject]
                  description: reject is rejected by service for Path C escalated TA-01 (canon §5.2.1 v3.3).
                notes:
                  type: string
                alternativeLecturerId:
                  type: string
                  format: uuid
                  description: Required when action=redirect.
      responses:
        '200':
          description: KaDep decision applied (booking_approved or redirected)
        '400':
          description: Invalid action for route type (e.g. Path C reject)

  /advisorRequest/{id}/assign:
    post:
      tags: [AdvisorRequest]
      summary: "[DEPRECATED] Legacy direct advisor assignment"
      description: >-
        Always returns 400. Legacy path that promoted booking to active_official
        and skipped early TA-04 batch + automatic promotion. Use KaDep decide
        (approve/redirect) then finalizeBatchTA04; active load promotes after
        TA-03 final + SIA takingThesisCourse.
      deprecated: true
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '400':
          description: Always — endpoint permanently disabled

  /thesisGuidance/student/proposal/upload:
    post:
      tags: [Proposal]
      summary: Upload a new proposal document version
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                description:
                  type: string
      responses:
        '200':
          description: Proposal version uploaded

  /thesisGuidance/student/proposal/versions:
    get:
      tags: [Proposal]
      summary: Get proposal document version history for the current student
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Proposal versions returned

  /thesisGuidance/student/proposal/status:
    get:
      tags: [Proposal]
      summary: Get current final-proposal submission status for the current student
      description: >-
        Returns hasBookedSupervisor, hasOfficialSupervisor,
        canSubmitFinalProposal, guidanceGateOpen, and guidanceGateReason.
        A booking reserves P1 and quota only; the final-submission gate opens
        after KaDep finalizes the applicable TA-04 batch.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Final proposal submission status returned

  /thesisGuidance/student/proposal/submit-final:
    post:
      tags: [Proposal]
      summary: Mark the latest proposal version as the official final proposal for TA-03 review
      description: >-
        Requires an issued TA-04 assignment. Private proposal drafts may be
        uploaded before TA-04, but this action returns 403 until KaDep has
        finalized the batch.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Final proposal submission stored

  /thesisGuidance/lecturer/students/{thesisId}/metopen/informal-logs:
    get:
      tags: [Proposal]
      summary: Read-only Metopel informal guidance notes for an active P1/P2 supervisor
      description: >-
        FR-LOG-08 / canon v3.0 §5.5. Returns informal notes + attachments for
        the thesis after hasOfficialSupervisor (P1 active + TA-04 issued).
        Active Pembimbing 1 or Pembimbing 2 only — no Koordinator Metopen /
        KaDep / Sekdep bypass. GET only; no create/update/delete/approve.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: thesisId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Informal log list returned
        '403':
          description: Not an active supervisor, or TA-04 guidance gate closed
        '404':
          description: Thesis not found

  /metopen/me/proposal-approval:
    get:
      tags: [Metopen]
      summary: Read student's title approval status and generated TA-04/title-approval document metadata
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Proposal approval status returned

  /metopen/me/seminar-eligibility:
    get:
      tags: [Metopen]
      summary: Check Seminar Hasil eligibility under canonical SIMPTA rules
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Eligibility evaluation returned

  /metopen/me/proposal-queue/sync:
    post:
      tags: [Metopen]
      summary: Synchronize automatic KaDep title-approval queue after final proposal, TA-03A, TA-03B, and SIA thesis-course confirmation
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Queue synchronization result returned

  /metopen/kadep/title-reports/pending:
    get:
      tags: [Metopen]
      summary: Deprecated — always returns empty (manual TA-04 review removed; use batch finalize)
      deprecated: true
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Empty array (manual review queue retired)

  /metopen/kadep/thesis/{thesisId}/title-report/review:
    post:
      tags: [Metopen]
      summary: Deprecated — always 400 (manual TA-04 review removed; use batch finalize)
      deprecated: true
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: thesisId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [accept, reject]
                notes:
                  type: string
      responses:
        '400':
          description: Always rejected — use batch TA-04 finalize instead
        '200':
          description: Deprecated success response (no longer returned)

  /metopen/me/archive:
    get:
      tags: [Metopen]
      summary: BR-23 — Student archive detail (read-only) after active TA promotion (4 categories)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Student archive detail returned

  /metopen/me/archive/title-approval-document:
    get:
      tags: [Metopen]
      deprecated: true
      summary: Deprecated — student TA-04 PDF download disabled; use status in /metopen/me/archive
      description: Mahasiswa melihat status penugasan TA-04 di sistem. PDF Formulir TA-04 batch adalah artefak cetak KaDep-only.
      security: [{ bearerAuth: [] }]
      responses:
        '403':
          description: Student PDF download is disabled; TA-04 status is available in archive/overview
        '404':
          description: Formulir TA-04 batch not finalized yet or file missing

  /metopen/kadep/title-reports/missing-document:
    get:
      tags: [Metopen]
      summary: Legacy — List active/early TA-04 theses not linked to official batch form
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: academicYearId
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List returned

  /metopen/kadep/title-reports/history:
    get:
      tags: [Metopen]
      summary: KaDep early TA-04 cohort (booking_approved + issued) plus legacy accepted/rejected
      description: >
        Returns the same early TA-04 cohort used by batch preview/finalize
        (booking_approved with active Pembimbing 1), including rows that are
        not yet ta04AssignmentIssuedAt, plus already-issued and legacy
        accepted/rejected rows. Aligns list UI with generateBatchTA04.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: academicYearId
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Early TA-04 cohort and decision history returned

  /metopen/kadep/thesis/{thesisId}/title-report/regenerate:
    post:
      tags: [Metopen]
      summary: Legacy — Per-thesis document generation is no longer official
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: thesisId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Request rejected; use batch finalization

  /metopen/kadep/thesis/{thesisId}/title-report/document:
    get:
      tags: [Metopen]
      summary: KaDep downloads Formulir TA-04 PDF for a thesis linked to a batch
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: thesisId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Formulir TA-04 PDF stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Document not available

  /assessment/criteria/{formCode}:
    get:
      tags: [Assessment]
      summary: Get active rubric criteria for TA-03A or TA-03B
      description: Returns research-method assessment criteria and rubric descriptors for the requested form code.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: formCode
          required: true
          schema:
            type: string
            enum: [TA-03A, TA-03B]
        - in: query
          name: academicYearId
          required: true
          schema:
            type: string
            format: uuid
          description: Periode pemilik CPMK, kriteria, dan komposisi nilai.
      responses:
        '200':
          description: Assessment criteria returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      formCode:
                        type: string
                      criteria:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                              nullable: true
                            maxScore:
                              type: integer
                              nullable: true
                            displayOrder:
                              type: integer
                            cpmk:
                              type: object
                              nullable: true
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                code:
                                  type: string
                                  nullable: true
                                description:
                                  type: string
                            assessmentRubrics:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                  minScore:
                                    type: integer
                                  maxScore:
                                    type: integer
                                  description:
                                    type: string

  /assessment/supervisor/queue:
    get:
      tags: [Assessment]
      summary: List TA-03A queue for the authenticated supervisor
      description: Returns only active students with open thesis status, submitted final proposal, and no TA-03A score.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: academicYearId
          required: true
          schema:
            type: string
            format: uuid
          description: Membatasi antrean ke thesis pada periode ini.
      responses:
        '200':
          description: TA-03A queue returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        thesisId:
                          type: string
                          format: uuid
                        thesisTitle:
                          type: string
                          nullable: true
                        student:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: string
                              format: uuid
                            fullName:
                              type: string
                            identityNumber:
                              type: string
                        supervisorScore:
                          type: integer
                          nullable: true

  /assessment/supervisor/{thesisId}/score:
    get:
      tags: [Assessment]
      summary: Get TA-03A score detail for supervisor
      description: Requires an active supervisor relation and an active thesis with final proposal submitted.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: thesisId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: TA-03A score detail returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                        format: uuid
                      thesisId:
                        type: string
                        format: uuid
                      supervisorScore:
                        type: integer
                        nullable: true
                      lecturerScore:
                        type: integer
                        nullable: true
                      finalScore:
                        type: integer
                        nullable: true
                      isFinalized:
                        type: boolean
                      researchMethodScoreDetails:
                        type: array
                        items:
                          type: object
    post:
      tags: [Assessment]
      summary: Submit TA-03A supervisor score
      description: Only Pembimbing 1 can submit TA-03A. The student must be active, thesis must not be closed, and final proposal must be submitted.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: thesisId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scores]
              properties:
                scores:
                  type: array
                  items:
                    type: object
                    required: [criteriaId, score]
                    properties:
                      criteriaId:
                        type: string
                        format: uuid
                      rubricId:
                        type: string
                        format: uuid
                        nullable: true
                        description: Selected AssessmentRubric descriptor for this criteria when rubric options exist.
                      score:
                        type: integer
      responses:
        '200':
          description: TA-03A score stored

  /assessment/metopen/attendance/latest:
    get:
      tags: [Assessment]
      summary: Latest Metopel attendance import summary
      description: Koordinator Matkul Metopen only (BR-19 + BR-28).
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: academicYearId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Latest import summary or null

  /assessment/metopen/attendance/preview:
    post:
      tags: [Assessment]
      summary: Dry-run preview of attendance upload (no writes)
      description: >-
        Koordinator-only. Returns rows that would be auto-zeroed permanently
        before commit (canon §5.7.3 / F-4.2). Multipart xlsx, same shape as upload.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [academicYearId]
              properties:
                academicYearId:
                  type: string
                  format: uuid
                file:
                  type: string
                  format: binary
                files:
                  type: array
                  maxItems: 2
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Preview summary returned

  /assessment/metopen/attendance/upload:
    post:
      tags: [Assessment]
      summary: Upload Metopel attendance xlsx (SIA export)
      description: >-
        Koordinator-only. Re-upload allowed for SIA corrections. Rows below 75%
        may be auto-zeroed for non-finalized theses in scope (BR-28).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [academicYearId]
              properties:
                academicYearId:
                  type: string
                  format: uuid
                file:
                  type: string
                  format: binary
                files:
                  type: array
                  maxItems: 2
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Import committed

  /assessment/metopen/attendance/eligibility/{thesisId}:
    get:
      tags: [Assessment]
      summary: Attendance gate eligibility for a thesis
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: thesisId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Eligibility snapshot for TA-03 mutation gates

  /assessment/metopen/queue:
    get:
      tags: [Assessment]
      summary: List TA-03B queue for Koordinator Matkul Metopen
      description: Returns active students with open thesis status, submitted final proposal, and no TA-03B score. TA-03B may run in parallel with TA-03A.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: academicYearId
          required: true
          schema:
            type: string
            format: uuid
          description: Membatasi antrean dan nilai ke thesis pada periode ini.
      responses:
        '200':
          description: TA-03B queue returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        thesisId:
                          type: string
                          format: uuid
                        thesisTitle:
                          type: string
                          nullable: true
                        student:
                          type: object
                          nullable: true
                          properties:
                            id:
                              type: string
                              format: uuid
                            fullName:
                              type: string
                            identityNumber:
                              type: string
                        supervisorName:
                          type: string
                          nullable: true
                        supervisorScore:
                          type: integer
                          nullable: true
                        lecturerScore:
                          type: integer
                          nullable: true

  /assessment/metopen/monitoring:
    get:
      tags: [Assessment]
      summary: Monitoring peserta, pembimbing, presensi, dan nilai Metopel per periode
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: academicYearId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Snapshot monitoring yang seluruh komponennya berasal dari periode yang sama

  /assessment/metopen/scores/export:
    get:
      tags: [Assessment]
      summary: Download nilai TA-03A + TA-03B kelas Metopel dalam format Template SIA (xlsx)
      description: |
        Hanya Koordinator Matkul Metopen. Menghasilkan workbook xlsx mengikuti
        layout template SIA (4 kolom skor: Presentasi 20, Proposal konten 40,
        Proposal struktur 25, Kemampuan merespon 15). Sumber data:
        `MetopenAttendanceImport` (default: terbaru) untuk daftar peserta, lalu
        bucketed dari `ResearchMethodScoreDetail` per mahasiswa via mapping
        CPMK code + role.

        BR-28 (canon v2.2 §5.7.x): Mahasiswa dengan presensi <75% yang sudah
        di-auto-zero tetap ditulis sebagai 0 di semua kolom skor, dengan note
        di kolom Keterangan; mahasiswa yang belum dinilai dikosongkan.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: academicYearId
          required: true
          schema:
            type: string
            format: uuid
          description: Periode presensi dan thesis yang diekspor.
        - in: query
          name: attendanceImportId
          required: false
          schema:
            type: string
            format: uuid
          description: |
            Override import presensi sumber export. Jika diisi, import wajib
            berasal dari academicYearId yang sama. Tanpa parameter ini service
            memakai import terbaru pada periode tersebut.
      responses:
        '200':
          description: Workbook xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '403':
          description: Bukan Koordinator Matkul Metopen
        '404':
          description: Belum ada import presensi yang dapat diekspor

  /assessment/metopen/{thesisId}/score:
    get:
      tags: [Assessment]
      summary: Get TA-03B score detail for Koordinator Matkul Metopen
      description: Koordinator Matkul Metopen can read an unscored active final-proposal thesis, or the score they submitted.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: thesisId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: TA-03B score detail returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                        format: uuid
                      thesisId:
                        type: string
                        format: uuid
                      supervisorScore:
                        type: integer
                        nullable: true
                      lecturerScore:
                        type: integer
                        nullable: true
                      finalScore:
                        type: integer
                        nullable: true
                      isFinalized:
                        type: boolean
                      researchMethodScoreDetails:
                        type: array
                        items:
                          type: object
    post:
      tags: [Assessment]
      summary: Submit TA-03B lecturer score
      description: The Koordinator Matkul Metopen can submit TA-03B for active students with a submitted final proposal. Final score auto-finalizes when TA-03A and TA-03B are both present.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: thesisId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scores]
              properties:
                scores:
                  type: array
                  items:
                    type: object
                    required: [criteriaId, score]
                    properties:
                      criteriaId:
                        type: string
                        format: uuid
                      rubricId:
                        type: string
                        format: uuid
                        nullable: true
                        description: Selected AssessmentRubric descriptor for this criteria when rubric options exist.
                      score:
                        type: integer
      responses:
        '200':
          description: TA-03B score stored

  /assessment/metopen/{thesisId}/publish:
    post:
      tags: [Assessment]
      summary: Legacy manual finalization endpoint for TA-03 score
      description: Backward-compatible endpoint only. Current SIMPTA flow auto-finalizes the score when TA-03A and TA-03B are both present.
      deprecated: true
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: thesisId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: TA-03 score finalized when it was not already finalized

