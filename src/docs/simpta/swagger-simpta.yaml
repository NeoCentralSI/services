  /supervision-quota/default/{academicYearId}:
    get:
      tags: [SupervisionQuota]
      summary: Get default supervision quota configuration
      description: Read-only for Admin, KaDep, and Sekdep.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: academicYearId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Default quota returned
    put:
      tags: [SupervisionQuota]
      summary: Set default supervision quota configuration
      description: Admin only. Saves the default and propagates it to lecturer quota rows atomically.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: academicYearId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Default quota saved and propagated

  /supervision-quota/lecturers/{academicYearId}:
    get:
      tags: [SupervisionQuota]
      summary: List lecturer quotas for an academic year
      description: >-
        Read-only for Admin, KaDep, and Sekdep. Active, booking, pending KaDep,
        normal availability, and valid-overquota totals come from the current
        computed snapshot; legacy currentCount is not trusted as source of truth.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: academicYearId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: Lecturer quota list returned

  /supervision-quota/lecturers/{lecturerId}/{academicYearId}:
    get:
      tags: [SupervisionQuota]
      summary: Get lecturer quota snapshot with metric drill-down rows
      description: >-
        Read-only for Admin, KaDep, and Sekdep. Returns the exact student rows
        behind active load, booking, pending KaDep, and valid overquota. Path C
        justification and reviewer notes are intentionally excluded; use the
        dedicated KaDep request detail for decision context.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: lecturerId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: academicYearId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Computed lecturer quota detail returned
        '404':
          description: Lecturer or academic year not found
    patch:
      tags: [SupervisionQuota]
      summary: Update lecturer-specific quota override
      description: Admin only.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: lecturerId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: academicYearId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lecturer quota updated

  /supervision-quota/recalculate/{academicYearId}:
    post:
      tags: [SupervisionQuota]
      summary: Refresh legacy quota counters from computed snapshots
      description: >-
        Admin only. Repairs legacy currentCount cache values; monitoring and
        decision-time reads still use computed snapshots directly.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: academicYearId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Legacy counters recalculated

